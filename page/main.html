<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>团队目录</title>
<style>
  :root {
    --bg: Canvas; --fg: CanvasText; --muted: GrayText;
    --border: color-mix(in srgb, CanvasText 15%, transparent);
    color-scheme: light dark;
  }
  body {
    margin: 16px 20px;
    font: 13px/1.5 -apple-system, "SF Pro Text", "PingFang SC", "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--fg);
  }
  h1 { font-size: 15px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 18px; }
  th { text-align: left; font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 8px 4px 0; }
  td { padding: 4px 8px 4px 0; vertical-align: top; border-top: 1px solid var(--border); }
  code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  .st { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; border: 1px solid var(--border); }
  .st.present, .st.configured { color: #1a7f37; }
  .st.outdated { color: #b45309; }
  .st.missing { color: #b91c1c; }
  .st.disabled { opacity: 0.5; }
  .st.unknown { opacity: 0.6; }
  input[type="text"] { width: 160px; }
  select, input, button { font: inherit; color: var(--fg); }
  .bar { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  button { padding: 4px 12px; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--fg) 35%, transparent); background: transparent; cursor: pointer; }
  button.primary { background: color-mix(in srgb, var(--fg) 10%, transparent); }
  .msg { font-size: 12px; color: var(--muted); }
  .err { color: #b91c1c; }
  .ovr { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .idx { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); white-space: pre-wrap; border: 1px dashed var(--border); padding: 8px 10px; margin-bottom: 16px; }
  label { display: inline-flex; gap: 4px; align-items: center; }
</style>
</head>
<body>
<h1>团队目录</h1>
<p class="sub">本机实测态 · 团队声明 registry.yaml · 覆盖仅本机生效</p>
<div id="app">加载中…</div>
<script>
// 由插件的 service 直接服务（127.0.0.1，框架仍是沙箱 opaque origin，
// 所有请求带 CORS）。数据：GET /state、GET /options；写回：POST /options
//（service 代执 magpie plugin options，触发宿主重载与新探测）、POST /refresh。
(async () => {
  const app = document.getElementById("app")
  const msg = document.createElement("div")
  msg.className = "msg"

  // 主题：带路页经查询串带来
  try {
    const q = new URLSearchParams(location.search).get("t")
    if (q) {
      const t = JSON.parse(decodeURIComponent(escape(atob(q))))
      if (t.tokens) for (const [k, v] of Object.entries(t.tokens)) {
        if (typeof v === "string" && v) document.documentElement.style.setProperty("--" + k, v)
      }
      if (t.dark) document.documentElement.style.colorScheme = "dark"
    }
  } catch {}

  let draft = {}
  let last = null

  async function refresh() {
    let view
    try {
      view = await (await fetch("/state")).json()
    } catch (e) {
      app.textContent = ""
      const p = document.createElement("p")
      p.className = "err msg"
      p.textContent = "service 暂不可达（可能在随宿主重启），稍后自动重试…"
      app.append(p)
      setTimeout(refresh, 3000)
      return
    }
    if (view.error) {
      app.textContent = ""
      const p = document.createElement("p")
      p.className = "err msg"
      p.textContent = view.error
      app.append(p)
      return
    }
    last = view
    let opts = {}
    try {
      opts = (await (await fetch("/options")).json()) ?? {}
    } catch {}
    draft = structuredClone(opts.overrides ?? {})
    render(view)
  }

  function render(view) {
    app.textContent = ""
    const bar = document.createElement("div")
    bar.className = "bar"
    const rerun = document.createElement("button")
    rerun.textContent = "立即重跑探测"
    rerun.onclick = rerunProbe
    const save = document.createElement("button")
    save.className = "primary"
    save.textContent = "保存本机覆盖"
    save.onclick = saveOverrides
    bar.append(rerun, save, msg)
    app.append(bar)

    if (view.index) {
      const pre = document.createElement("div")
      pre.className = "idx"
      pre.textContent = "当前注入索引：\n" + view.index
      app.append(pre)
    }

    app.append(toolTable(view.tools))
    const p = projectTable(view.projects)
    if (p) app.append(p)

    const sub = document.createElement("p")
    sub.className = "sub"
    sub.textContent = view.checkedAt ? "探测时间：" + view.checkedAt : "尚未探测"
    app.append(sub)
  }

  function toolTable(tools) {
    const t = document.createElement("table")
    const head = document.createElement("tr")
    for (const h of ["工具", "状态", "版本", "途径", "探测时间", "本机覆盖（bin / 启用 / 钉死）"]) {
      const th = document.createElement("th")
      th.textContent = h
      head.append(th)
    }
    t.append(head)
    for (const tool of tools) {
      const tr = document.createElement("tr")
      const name = document.createElement("td")
      const b = document.createElement("b")
      b.textContent = tool.id
      name.append(b)
      if (tool.name) {
        const span = document.createElement("span")
        span.className = "sub"
        name.append(document.createElement("br"), span)
        span.textContent = tool.name
      }
      const code = document.createElement("code")
      code.className = "sub"
      code.textContent = tool.install
      name.append(document.createElement("br"), code)
      const st = document.createElement("td")
      const badge = document.createElement("span")
      badge.className = "st " + tool.status
      badge.textContent = tool.status
      st.append(badge, document.createTextNode(tool.version ? " " + tool.version : ""))
      const ver = document.createElement("td")
      ver.textContent = [tool.version, tool.min ? "(min " + tool.min + ")" : ""].filter(Boolean).join(" ")
      const via = document.createElement("td")
      via.textContent = tool.via ?? ""
      const at = document.createElement("td")
      at.className = "sub"
      at.textContent = tool.at ? new Date(tool.at).toLocaleString() : ""
      const ovr = document.createElement("td")
      ovr.append(overrideControls(tool))
      tr.append(name, st, ver, via, at, ovr)
      t.append(tr)
    }
    return t
  }

  function projectTable(projects) {
    if (!projects || projects.length === 0) return null
    const t = document.createElement("table")
    const head = document.createElement("tr")
    for (const h of ["项目", "地址", "备注"]) {
      const th = document.createElement("th")
      th.textContent = h
      head.append(th)
    }
    t.append(head)
    for (const p of projects) {
      const tr = document.createElement("tr")
      const id = document.createElement("td")
      const b = document.createElement("b")
      b.textContent = p.id
      id.append(b)
      if (p.name) {
        const span = document.createElement("span")
        span.className = "sub"
        id.append(document.createElement("br"), span)
        span.textContent = p.name
      }
      const vcs = document.createElement("td")
      const code = document.createElement("code")
      code.textContent = p.vcs ?? p.url ?? ""
      vcs.append(code)
      const note = document.createElement("td")
      note.className = "sub"
      note.textContent = p.note ?? ""
      tr.append(id, vcs, note)
      t.append(tr)
    }
    return t
  }

  function overrideControls(tool) {
    const wrap = document.createElement("div")
    wrap.className = "ovr"
    const cur = draft[tool.id] ?? {}

    const bin = document.createElement("input")
    bin.type = "text"
    bin.placeholder = "bin 覆盖路径"
    bin.value = cur.bin ?? ""
    bin.onchange = () => setDraft(tool.id, "bin", bin.value.trim() || undefined)

    const en = document.createElement("label")
    const cb = document.createElement("input")
    cb.type = "checkbox"
    cb.checked = cur.enabled !== false
    cb.onchange = () => setDraft(tool.id, "enabled", cb.checked ? undefined : false)
    en.append(cb, document.createTextNode("启用"))

    const pin = document.createElement("select")
    for (const [v, label] of [["", "自动"], ["present", "present"], ["configured", "configured"], ["outdated", "outdated"], ["missing", "missing"]]) {
      const o = document.createElement("option")
      o.value = v
      o.textContent = label
      pin.append(o)
    }
    pin.value = cur.status ?? ""
    pin.onchange = () => setDraft(tool.id, "status", pin.value || undefined)

    wrap.append(bin, en, pin)
    return wrap
  }

  function setDraft(id, key, value) {
    const cur = draft[id] ?? {}
    if (value === undefined) delete cur[key]
    else cur[key] = value
    if (Object.keys(cur).length === 0) delete draft[id]
    else draft[id] = cur
    msg.textContent = Object.keys(draft).length > 0 ? "有未保存的覆盖修改" : ""
  }

  async function saveOverrides() {
    msg.textContent = "保存中…（options 变更会触发宿主重载与新探测，页面会自动刷新）"
    try {
      const r = await fetch("/options", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ overrides: draft }),
      })
      if (!r.ok) throw new Error(await r.text())
      await pollUntil((t) => t !== (last?.checkedAt ?? null), 60)
      await refresh()
      msg.textContent = "已保存"
    } catch (e) {
      msg.textContent = "保存失败：" + (e?.message ?? e)
    }
  }

  async function rerunProbe() {
    msg.textContent = "探测中…"
    try {
      await fetch("/refresh", { method: "POST" })
      await pollUntil((t) => t !== (last?.checkedAt ?? null), 60)
      msg.textContent = ""
      await refresh()
    } catch (e) {
      msg.textContent = "重跑失败：" + (e?.message ?? e)
    }
  }

  async function pollUntil(changed, seconds) {
    const deadline = Date.now() + seconds * 1000
    while (Date.now() < deadline) {
      await new Promise((r) => setTimeout(r, 1000))
      let view
      try {
        view = await (await fetch("/state")).json()
      } catch {
        continue // 宿主重启窗口，service 短暂不可达
      }
      if (view && !view.error && changed(view.checkedAt ?? null)) {
        last = view
        return view
      }
    }
    throw new Error("timeout")
  }

  await refresh()
})()
</script>
</body>
</html>
