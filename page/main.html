<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="catalog-token" content="__CATALOG_TOKEN__">
<meta name="catalog-session" content="__CATALOG_SESSION__">
<title>团队目录</title>
<style>
:root { color-scheme:light dark; --bg:Canvas; --fg:CanvasText; --muted:GrayText; --border:color-mix(in srgb,CanvasText 14%,transparent); --card:color-mix(in srgb,Canvas 96%,CanvasText); --accent:#3973df; }
* { box-sizing:border-box; } [hidden] { display:none!important; }
body { margin:0; padding:24px; background:var(--bg); color:var(--fg); font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",system-ui,sans-serif; }
h1,h2,h3,p { margin:0; } h1 { font-size:24px; letter-spacing:-.5px; } h2 { font-size:18px; } h3 { font-size:14px; }
button,input,textarea,select { font:inherit; color:inherit; } button { border:1px solid var(--border); border-radius:8px; background:var(--bg); padding:7px 12px; cursor:pointer; transition:background .12s; }
button:hover:not(:disabled) { background:color-mix(in srgb,var(--accent) 8%,var(--bg)); border-color:var(--accent); } button:disabled { opacity:.5; cursor:default; } button.primary { background:var(--accent); color:white; border-color:var(--accent); } button.danger { color:#c33; } :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
input:not([type=checkbox]),select,textarea { border:1px solid var(--border); border-radius:7px; background:var(--bg); padding:8px 10px; min-width:0; } textarea { resize:vertical; min-height:85px; } input[type=checkbox] { accent-color:var(--accent); }
.hint,.muted { color:var(--muted); font-size:12px; } .hint { display:block; overflow-wrap:anywhere; } .bar,.actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .actions { justify-content:flex-end; }
.hero { display:flex; justify-content:space-between; gap:18px; align-items:center; margin-bottom:20px; } .hero p { margin-top:4px; } .stats { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:18px; } .stat { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; } .stat strong { display:block; font-size:23px; font-weight:650; }
.tabs { display:flex; gap:6px; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:16px; } .tabs button[aria-selected=true] { background:color-mix(in srgb,var(--accent) 12%,var(--bg)); color:var(--accent); border-color:transparent; font-weight:600; }
.filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; } .filters input { flex:1; min-width:180px; } .filters select { max-width:180px; } .section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:12px 0; flex-wrap:wrap; }
.entries { display:grid; gap:10px; } .entry { border:1px solid var(--border); border-radius:10px; padding:14px 16px; background:var(--bg); min-width:0; } .entry-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; } .entry-name { display:flex; align-items:center; gap:7px; flex-wrap:wrap; } .entry-id { color:var(--muted); font:11px/1.6 ui-monospace,monospace; overflow-wrap:anywhere; } .entry-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; } .tag,.badge { display:inline-block; border-radius:5px; padding:1px 7px; font-size:11px; background:var(--card); border:1px solid var(--border); } .badge.present,.badge.configured { color:#238344; } .badge.missing,.badge.not-repository { color:#c33; } .badge.outdated { color:#b8750f; } .badge.disabled { color:var(--muted); }
.path { font:12px/1.6 ui-monospace,monospace; overflow-wrap:anywhere; color:var(--muted); margin-top:7px; } .entry-summary { margin-top:8px; max-width:100%; overflow-wrap:anywhere; } .entry-actions { margin-top:10px; } .entry-actions button { padding:4px 9px; font-size:12px; }
details { margin-top:10px; } summary { cursor:pointer; color:var(--muted); font-size:12px; } pre { white-space:pre-wrap; overflow-wrap:anywhere; background:var(--card); padding:10px; border-radius:7px; font:12px/1.6 ui-monospace,monospace; max-height:280px; overflow:auto; } .group { margin-bottom:14px; border:1px solid var(--border); border-radius:10px; padding:12px; } .group>summary { display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--fg); padding:2px 3px 10px; } .group .entries { margin-top:4px; }
.empty { text-align:center; color:var(--muted); padding:35px 16px; border:1px dashed var(--border); border-radius:10px; } .notice { padding:9px 12px; border-radius:8px; background:var(--card); border:1px solid var(--border); margin-bottom:12px; white-space:pre-wrap; overflow-wrap:anywhere; } .notice.error,.form-error { color:#bf3333; } .notice.success { color:#238344; } .warning { color:#b8750f; white-space:pre-wrap; }
.draft-bar { position:sticky; bottom:12px; background:var(--bg); border:1px solid var(--accent); border-radius:10px; padding:12px; margin-top:14px; box-shadow:0 3px 18px #0001; display:flex; justify-content:space-between; align-items:center; gap:8px; }
dialog { max-width:760px; width:calc(100vw - 32px); max-height:90vh; padding:0; border:1px solid var(--border); border-radius:14px; background:var(--bg); color:var(--fg); box-shadow:0 12px 60px #0003; } dialog::backdrop { background:#0005; } .dialog-head { padding:20px 22px 12px; border-bottom:1px solid var(--border); } .dialog-head p { margin-top:6px; } .editor-form { padding:16px 22px; } .dialog-footer { position:sticky; bottom:0; padding:12px 22px; background:var(--bg); border-top:1px solid var(--border); } .form-section { border:0; padding:0; margin:0 0 18px; min-width:0; } legend { font-weight:600; padding:0; margin-bottom:10px; } .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } .field { display:flex; flex-direction:column; gap:5px; min-width:0; } .field.wide { grid-column:1/-1; } .field-label { font-size:12px; font-weight:550; } .field>input,.field>select,.field>textarea { width:100%; } .advanced { padding:10px 0; } .advanced>summary { padding-bottom:12px; } .form-error:not(:empty) { padding:8px 0; } .consent { display:flex; align-items:flex-start; gap:8px; font-size:12px; margin:12px 0; } .confirm-dialog { max-width:420px; padding:22px; } .confirm-dialog p { margin:10px 0 20px; } .candidate-list { margin:12px 0; } .candidate { padding:10px 0; border-top:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:10px; } .candidate>div { min-width:0; overflow-wrap:anywhere; }
@media(max-width:640px) { body { padding:14px; } .hero { align-items:flex-start; flex-direction:column; } .stats { grid-template-columns:1fr 1fr; } .form-grid { grid-template-columns:1fr; } .field.wide { grid-column:auto; } .entry-head { flex-direction:column; } .filters select { flex:1; max-width:none; } .dialog-head,.editor-form,.dialog-footer { padding-left:16px; padding-right:16px; } }
</style>
</head>
<body>
<div id="app" aria-live="polite">正在加载团队目录…</div>
<script>
window.addEventListener("error", e => { const app=document.getElementById("app"); if(app) app.textContent="页面脚本错误："+(e.message||"未知错误")+"；请重新加载页面。" })
window.addEventListener("unhandledrejection", e => { const app=document.getElementById("app"); if(app) app.textContent="页面初始化失败："+(e.reason?.message||e.reason)+"；请重新加载页面。" })
</script>
<script src="/session-client.js"></script>
<script src="/ui-kit.js"></script>
<script src="/catalog-ui.js"></script>
<script src="/project-ui.js"></script>
<script src="/catalog-app.js"></script>
</body>
</html>
